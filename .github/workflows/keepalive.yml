name: Keepalive — Prevent 60-day workflow auto-disable

# GitHub auto-disables scheduled workflows after 60 days with no commits.
# This workflow runs weekly, writes a timestamp, and commits it — keeping
# the scheduled-signals.yml workflow alive indefinitely.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 0'           # Every Sunday at midnight UTC

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update keepalive timestamp
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/keepalive-timestamp

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive-timestamp
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: keepalive timestamp [skip ci]"
          git push
