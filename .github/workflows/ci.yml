name: CI — AlphaFlow Market Microstructure Alpha Engine

# Author: Anthony Breeganzo Thomas
# AlphaFlow — Quant Research Portfolio for Imperial College MSc RMFE

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── Python: Tests ─────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          # Python 3.11 — most stable for C extensions (SHAP, LightGBM, NumPy).
          # Python 3.13 causes segfaults in SHAP TreeExplainer on Ubuntu CI
          # due to changed C memory model (shap issue #3668). Upgrade when
          # shap>=0.47 and lightgbm>=4.6 confirm 3.13 support.
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (non-blocking ruff)
        run: pip install ruff && ruff check . --exit-zero

      - name: Run all tests (offline, no API keys required)
        run: python -m pytest tests/ -v --tb=short --no-header

  # ─── Python: Backend import sanity ─────────────────────────────────────────
  backend-check:
    name: Backend import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify backend + settings compile
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from backend.main import app; print('backend OK')
          from alpha_flow.config.settings import get_all_tickers, TICKERS
          assert len(TICKERS) == 50, f'Expected 50 default tickers, got {len(TICKERS)}'
          assert len(get_all_tickers()) >= len(TICKERS), 'get_all_tickers() must include the defaults'
          print(f'settings OK — {len(TICKERS)} default tickers, get_all_tickers() works')
          "

  # ─── React: Frontend build ─────────────────────────────────────────────────
  frontend-build:
    name: React Build (TypeScript, 0 errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: TypeScript type check
        run: cd frontend && node_modules/.bin/tsc --noEmit
      - name: Build production bundle
        run: cd frontend && npm run build
